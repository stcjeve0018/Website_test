<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子抽獎系統</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <header class="text-center mb-4">
            <h1 class="display-5 fw-bold">電子抽獎系統</h1>
            <p class="text-muted">輸入參與者名單與獎項，即可快速完成抽獎。</p>
          </header>
          <div class="card shadow lottery-card">
            <div class="card-body">
              <form id="lottery-form" novalidate>
                <div class="mb-3">
                  <label for="participants" class="form-label">參與者名單</label>
                  <textarea id="participants" class="form-control" rows="5" placeholder="例如：小明, 小美, 小華 或一行一位" required></textarea>
                </div>
                <div class="mb-3">
                  <label for="prize" class="form-label">獎項名稱</label>
                  <input type="text" id="prize" class="form-control" placeholder="例如：雙人郵輪晚宴" required>
                </div>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
                  <button type="reset" class="btn btn-outline-secondary">清除</button>
                  <button type="submit" class="btn btn-primary" id="draw-button">開始抽獎</button>
                </div>
              </form>
              <div class="alert mt-3 d-none" role="alert" id="lottery-message"></div>
              <div class="lottery-result text-center mt-4">
                <p class="text-uppercase text-muted mb-1">中獎者</p>
                <div class="winner-name" id="winner-name">尚未抽獎</div>
                <p class="fs-5 mt-3" id="prize-name"></p>
              </div>
              <div class="lottery-history mt-4">
                <h2 class="h5">抽獎紀錄</h2>
                <ul class="list-group" id="history-list"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
